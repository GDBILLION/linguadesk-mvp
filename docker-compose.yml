services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linguadesk}
      POSTGRES_USER: ${POSTGRES_USER:-linguadesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "5432:5432"
    volumes:
      - linguadesk_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linguadesk} -d ${POSTGRES_DB:-linguadesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      LT_LOAD_ONLY: "en,es,fr,de,zh"
      LT_UPDATE_MODELS: "true"
    volumes:
      - libretranslate_models:/home/libretranslate/.local:rw
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 60s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-linguadesk};Username=${POSTGRES_USER:-linguadesk};Password=${POSTGRES_PASSWORD:-change-this-local-password}
      ASPNETCORE_URLS: http://+:5080
      Translation__Provider: ${Translation__Provider:-libretranslate}
      Translation__LibreTranslateUrl: ${Translation__LibreTranslateUrl:-http://libretranslate:5000/translate}
      Translation__ApiKey: ${Translation__ApiKey:-}
    ports:
      - "5080:5080"
    depends_on:
      db:
        condition: service_healthy
      libretranslate:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:5080
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  linguadesk_data:
  libretranslate_models:
